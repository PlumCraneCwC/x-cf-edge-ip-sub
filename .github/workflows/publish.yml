name: Refresh and publish affected X AdGuard rules

on:
  schedule:
    # Eight runs per day, offset from the top of the hour to reduce queue contention.
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "scripts/**"
      - "targets.txt"
      - "preferred-ip.txt"
      - "tests/**"
      - "site/**"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Probe candidates and generate the filter
        run: |
          mkdir -p site
          python scripts/build_filter.py --output site/xcom.txt
          test -s site/xcom.txt
          cat site/xcom.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
